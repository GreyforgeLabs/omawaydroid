[package]
name = "droidsmith"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Make Waydroid just work: diagnose and fix the host-side problems that stop Android apps running on Linux"
rust-version = "1.85"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
flate2 = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
